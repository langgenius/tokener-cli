name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Verify SemVer release tag
        id: check-release-tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          pattern='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(alpha|beta|rc)\.(0|[1-9][0-9]*))?$'
          if [[ ! "$RELEASE_TAG" =~ $pattern || "$RELEASE_TAG" =~ -(alpha|beta|rc)\.0$ ]]; then
            echo "::error::Invalid SemVer release tag: $RELEASE_TAG"
            exit 1
          fi
          if [[ "$RELEASE_TAG" == *-* ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate release notes
        uses: orhun/git-cliff-action@3d96a18cc4ec17e9dc69ddcc424ccafaf1f78ce2
        env:
          GIT_CLIFF_IGNORE_TAGS: '.*-(alpha|beta|rc)\..*'
          GIT_CLIFF_TAG: ${{ github.ref_name }}
        with:
          config: cliff.toml
          args: --strip all --output ${{ runner.temp }}/generated-notes.md

      - name: Verify changelog parity
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          GENERATED_NOTES: ${{ runner.temp }}/generated-notes.md
          RELEASE_NOTES: ${{ runner.temp }}/release-notes.md
        run: python3 scripts/release-notes.py "$RELEASE_TAG" "$GENERATED_NOTES" > "$RELEASE_NOTES"

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check
        run: make ci-check

      - name: Verify generated files
        run: git diff --exit-code

      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.18.0
          args: release --clean --release-notes=${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
