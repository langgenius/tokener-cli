name: PR policy

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  title:
    name: PR title
    runs-on: ubuntu-latest
    steps:
      - name: Conventional Commit title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          pattern='^(feat|fix|docs|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: [^ ].*$'
          if [[ ! "$TITLE" =~ $pattern ]]; then
            echo "::error::\"$TITLE\" is not a Conventional Commit title; expected type(scope): subject"
            exit 1
          fi

  comments:
    name: No added Go comments
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Reject added comment lines
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          found=$(git diff -U0 --no-color --merge-base "$BASE_SHA" "$HEAD_SHA" -- \
            '*.go' ':!internal/generated' ':!skills/tokener' | awk '
            /^\+\+\+ b\// { file = substr($0, 7); next }
            /^@@/ { match($0, /\+[0-9]+/); line = substr($0, RSTART + 1, RLENGTH - 1) - 1; next }
            /^\+/ {
              line++
              text = substr($0, 2)
              if (text ~ /^[ \t]*(\/\/|\/\*)/ \
                  && text !~ /^[ \t]*\/\/go:/ \
                  && text !~ /^[ \t]*\/\/ *nolint/ \
                  && text !~ /^[ \t]*\/\/ *\+build/) {
                print "::error file=" file ",line=" line "::Go code here has no comments; put the reasoning in names, tests, or the PR description"
              }
            }
          ')
          if [[ -n "$found" ]]; then
            echo "$found"
            exit 1
          fi
