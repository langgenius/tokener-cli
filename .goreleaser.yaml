version: 2

project_name: tokener

builds:
  - id: tokener
    main: ./cmd/tokener
    binary: tokener
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/lathe-cli/lathe/pkg/lathe.Version={{ .Version }}
      - -X github.com/lathe-cli/lathe/pkg/lathe.Commit={{ .ShortCommit }}
      - -X github.com/lathe-cli/lathe/pkg/lathe.Date={{ .Date }}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: linux
        goarch: arm64
      - goos: windows
        goarch: arm64

archives:
  - id: cli
    ids:
      - tokener
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"

release:
  github:
    owner: langgenius
    name: tokener-cli
  prerelease: auto
  name_template: "{{ .Tag }}"

brews:
  - name: tokener
    ids:
      - cli
    repository:
      owner: langgenius
      name: tokener-cli
      branch: "homebrew/{{ .ProjectName }}-{{ .Version }}"
      pull_request:
        enabled: true
        base:
          owner: langgenius
          name: tokener-cli
          branch: main
    directory: Formula
    commit_msg_template: "chore(homebrew): update tokener to {{ .Tag }}"
    homepage: https://tokener.dev/
    description: Command-line client and agent launcher for Tokener.ai
    test: |
      assert_match version.to_s, shell_output("#{bin}/tokener --version")
      system "#{bin}/tokener", "commands", "--json"
      system "#{bin}/tokener", "agent", "--help"
