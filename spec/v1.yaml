          description: Keys for the caller's organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeyListResponse"
        "401":
          description: Missing or invalid management token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: create
      tags:
        - keys
      summary: Create a Tokener.ai API key (returns the plaintext secret once)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateKeyRequest"
      responses:
        "202":
          description: Key created; plaintext secret returned once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateKeyResult"
        "400":
          description: Invalid request body or query
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid management token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The caller's email is not verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/keys/{id}/limits:
    patch:
      operationId: updateLimits
      tags:
        - keys
      summary: Replace budget, rate, model, and expiry limits for a key (full
        replacement; omitted/null fields are cleared)
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KeyLimitsInput"
      responses:
        "200":
          description: Applied and synced
