      additionalProperties: false
    UsageSeriesResponse:
      type: object
      properties:
        connected:
          type: boolean
        points:
          type: array
          items:
            $ref: "#/components/schemas/UsageSeriesPoint"
      required:
        - connected
        - points
      additionalProperties: false
    UsageSeriesPoint:
      type: object
      properties:
        day:
          type: string
        requests:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
        tokens:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
        spendUsdMicro:
          type: string
          description: Amount in micro-USD (1e-6 USD) serialized as a decimal string.
        segments:
          type: array
          items:
            $ref: "#/components/schemas/UsageSeriesSegment"
      required:
        - day
        - requests
        - tokens
        - spendUsdMicro
        - segments
      additionalProperties: false
    UsageSeriesSegment:
      type: object
      properties:
        key:
          type: string
          description: Model id, or "other" for the bucketed remainder.
        requests:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
      required:
        - key
        - requests
      additionalProperties: false
    UsageBreakdownResponse:
      type: object
      properties:
        connected:
          type: boolean
        by:
          type: string
          const: model
        rows:
          type: array
          items:
            $ref: "#/components/schemas/UsageBreakdownRow"
      required:
        - connected
        - by
        - rows
      additionalProperties: false
    UsageBreakdownRow:
      type: object
      properties:
        key:
          type: string
          description: Model id.
        requests:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
        tokens:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
        spendUsdMicro:
          type: string
          description: Amount in micro-USD (1e-6 USD) serialized as a decimal string.
      required:
        - key
        - requests
        - tokens
        - spendUsdMicro
      additionalProperties: false
    ModelListResponse:
      type: object
      properties:
        connected:
          type: boolean
        models:
          type: array
          items:
            $ref: "#/components/schemas/CatalogModel"
      required:
        - connected
        - models
      additionalProperties: false
    CatalogModel:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        provider:
          type: string
        category:
          type: string
          enum:
            - chat
            - reasoning
            - embedding
        context:
          type: string
        inputPer1m:
          type: string
        cachePer1m:
          type: string
        outputPer1m:
          type: string
        status:
          type: string
          enum:
            - available
            - unavailable
      required:
        - id
        - name
        - provider
        - category
        - context
        - inputPer1m
        - cachePer1m
        - outputPer1m
        - status
      additionalProperties: false
  securitySchemes:
    managementToken:
      type: http
      scheme: bearer
      description: Tokener.ai management personal access token (prefix `tkr_pat_`).
        Distinct from Tokener.ai API keys, which authenticate LLM traffic at the
        Gateway and must not be used here.
