openapi: 3.1.0
info:
  title: Tokener.ai Console Management API
  version: 0.1.0
  description: Token-authenticated management surface for the Tokener.ai console.
    Mirrors the console BFF (keys, billing, usage, models) but authenticates
    with a management personal access token (PAT) instead of a browser session,
    so it can back a CLI and agent tooling. It is not the LLM data plane
    (Gateway) and not the LiteLLM Admin API.
servers:
  - url: https://console.tokener.ai
    description: Production console
  - url: http://localhost:3000
    description: Local development console
security:
  - managementToken: []
tags:
  - name: identity
    description: Resolve the user, organization, token name, and email-verification
      state behind the presented management token.
  - name: keys
    description: "Manage Tokener.ai API keys for the caller's organization: list
      them with 30-day spend, create them, replace their
      budget/rate/model/expiry limits, enable or disable them, and revoke them."
  - name: billing
    description: "Read the organization's prepaid credit state: available balance
      projection, append-only ledger entries, and credit purchase history."
  - name: usage
    description: "Read the organization's usage over a 7- or 30-day range: totals,
      per-day series with per-model segments, and aggregates by model."
  - name: models
    description: List the public managed model catalog, including the models and
      pricing metadata available to the caller's organization.
paths:
  /api/v1/whoami:
    get:
      operationId: whoami
      tags:
        - identity
      summary: Resolve the caller identity for the presented management token
      responses:
        "200":
          description: Token is valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhoAmI"
        "401":
          description: Missing or invalid management token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/keys:
