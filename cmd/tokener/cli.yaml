cli:
  name: tokener
  short: "Command-line tool for the Tokener.ai console management API"

auth:
  default_type: oauth
  login:
    type: oauth_device
    start_path: /api/device-login/start
    token_path: /api/device-login/token
    start_request:
      device_label: Tokener CLI
    poll_request:
      device_code: ${device_code}
  validate:
    method: GET
    path: /api/v1/whoami
    display:
      username_field: email
      fallback_field: userId

skill:
  root: skills
  bundle: true
  include:
    path: internal/skill-include
    files:
      SKILL.md: replace

update:
  github:
    owner: langgenius
    repo: tokener-cli
    asset: "tokener_{{ .Version }}_{{ .OS }}_{{ .Arch }}.tar.gz"
