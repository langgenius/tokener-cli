groups:
  billing:
    short: Inspect credits, purchases, and ledger activity
  identity:
    short: Inspect the authenticated management identity
  keys:
    short: Create and manage Tokener.ai API keys
  models:
    short: Browse models available through Tokener.ai
  usage:
    short: Inspect spend and model usage

commands:
  balance:
    match:
      method: GET
      path: /api/v1/billing/balance
    short: Show the available Tokener.ai credit balance
    long: |
      Shows the purchased, granted, and total available credits for the
      authenticated organization. Monetary values are returned in micro-USD.
    example: |
      tokener billing balance
      tokener billing balance -o json
    output:
      default_columns: [availableUsdMicro, purchasedAvailableUsdMicro, grantedAvailableUsdMicro, status, updatedAt]
      column_labels:
        availableUsdMicro: TOTAL
        purchasedAvailableUsdMicro: PURCHASED
        grantedAvailableUsdMicro: GRANTED
        status: STATUS
        updatedAt: UPDATED
      column_formats:
        availableUsdMicro:
          kind: currency
          currency: USD
          source_scale: 6
          grouping: true
          min_fraction_digits: 2
          max_fraction_digits: 6
        purchasedAvailableUsdMicro:
          kind: currency
          currency: USD
          source_scale: 6
          grouping: true
          min_fraction_digits: 2
          max_fraction_digits: 6
        grantedAvailableUsdMicro:
          kind: currency
          currency: USD
          source_scale: 6
          grouping: true
          min_fraction_digits: 2
          max_fraction_digits: 6

  ledger:
    match:
      method: GET
      path: /api/v1/billing/ledger
    short: List credit ledger activity
    long: |
      Lists the organization's append-only credit ledger. Use --all to follow
      every page or --cursor to continue from a previously returned page.
      Monetary values are returned in micro-USD.
    example: |
      tokener billing ledger --limit 25
      tokener billing ledger --all -o json
    output:
      default_columns: [occurredAt, amountUsdMicro, type, sourceType, description, id]
      column_labels:
        occurredAt: TIME
        amountUsdMicro: AMOUNT
        type: TYPE
        sourceType: SOURCE
        description: DESCRIPTION
        id: ID
      column_formats:
        amountUsdMicro:
          kind: currency
          currency: USD
          source_scale: 6
          grouping: true
          min_fraction_digits: 2
          max_fraction_digits: 6
    params:
      cursor:
        help: Opaque cursor returned by the previous page
      limit:
        help: Number of ledger entries per page (1-100)

  purchases:
    match:
      method: GET
      path: /api/v1/billing/purchases
    short: List credit purchases
    long: |
      Lists purchases that added prepaid credits to the organization. Use
      --all to follow every page or --cursor to continue from a previous page.
    example: |
      tokener billing purchases --limit 25
      tokener billing purchases --all -o json
    output:
      default_columns: [createdAt, status, amountCents, creditAmountUsdMicro, currency, id]
      column_labels:
        createdAt: TIME
        status: STATUS
        amountCents: PAID
        creditAmountUsdMicro: CREDIT
        currency: CURRENCY
        id: ID
      column_formats:
        amountCents:
          kind: currency
          currency: USD
          source_scale: 2
          grouping: true
          min_fraction_digits: 2
          max_fraction_digits: 2
        creditAmountUsdMicro:
          kind: currency
          currency: USD
          source_scale: 6
          grouping: true
          min_fraction_digits: 2
          max_fraction_digits: 6
    params:
      cursor:
        help: Opaque cursor returned by the previous page
      limit:
        help: Number of purchases per page (1-100)

  whoami:
    match:
      method: GET
      path: /api/v1/whoami
    short: Show the authenticated user and organization
    long: |
      Validates the configured management token and shows the user,
      organization, token name, and email-verification state behind it.
    example: |
      tokener identity whoami
      tokener identity whoami -o json
    output:
      default_columns: [email, emailVerified, tokenName, organizationId, userId]
      column_labels:
        email: EMAIL
        emailVerified: VERIFIED
        tokenName: TOKEN
        organizationId: ORGANIZATION
        userId: USER

  create:
    match:
      method: POST
      path: /api/v1/keys
    short: Create an API key
    long: |
      Creates a Tokener.ai API key and returns its plaintext secret. Set simple
      body fields with --set or --set-str, or pass a complete JSON body with
      --file. Treat the response as a credential. The plaintext secret appears
      only in the key field of structured output and via keys reveal.
    example: |
      tokener keys create --set-str name=production -o json
      tokener keys create \
        --set-str name=production \
        --set limits.maxBudgetUsd=100 \
        --set-str limits.budgetDuration=monthly \
        -o json
    output:
      default_columns: [record.name, record.prefix, record.status, record.id, record.createdAt]
      column_labels:
        record.name: NAME
        record.prefix: PREFIX
        record.status: STATUS
        record.id: ID
        record.createdAt: CREATED

  list:
    match:
      method: GET
      path: /api/v1/keys
    short: List API keys and 30-day spend
    long: |
      Lists API keys for the authenticated organization, including lifecycle
      status, limits, last use, and 30-day spend. Plaintext secrets are never
      included. Spend values are returned in micro-USD.
    example: |
      tokener keys list
      tokener keys list -o json
    output:
      default_columns: [name, status, prefix, spend30d, limits.maxBudgetUsdMicro, lastUsedAt, id]
      column_labels:
        name: NAME
        status: STATUS
        prefix: PREFIX
        spend30d: "SPEND 30D"
        limits.maxBudgetUsdMicro: BUDGET
        lastUsedAt: "LAST USED"
        id: ID
      column_formats:
        spend30d:
          kind: currency
          currency: USD
          source_scale: 6
          grouping: true
          min_fraction_digits: 2
          max_fraction_digits: 6
        limits.maxBudgetUsdMicro:
          kind: currency
          currency: USD
          source_scale: 6
          grouping: true
          min_fraction_digits: 2
          max_fraction_digits: 6

  reveal:
    match:
      method: POST
      path: /api/v1/keys/{id}/reveal
    short: Reveal an API key secret
    long: |
      Returns the plaintext secret for a key that has not been revoked. The
      output is sensitive and should not be written to logs or shell history.
    notes:
      - The output is a credential. Do not write it to logs or shell history.
    known_errors:
      - status: 400
        cause: The key is already revoked.
    example: |
      tokener keys reveal <key-id> -o json
    params:
      id:
        argument: key-id
        help: API key ID

  revoke:
    match:
      method: POST
      path: /api/v1/keys/{id}/revoke
    short: Permanently revoke an API key
    long: |
      Permanently revokes an API key. A revoked key cannot make model calls or
      have its plaintext secret revealed again.
    known_errors:
      - status: 400
        cause: The key is already revoked.
    example: |
      tokener keys revoke <key-id> -o json
    params:
      id:
        argument: key-id
        help: API key ID

  set-status:
    match:
      method: POST
      path: /api/v1/keys/{id}/status
    body:
      flags: true
    short: Enable or disable an API key
    long: |
      Sets an API key to active or disabled. The change may remain in a
      preparing state until model-call enforcement converges.
    known_errors:
      - status: 400
        cause: The key is already revoked.
    example: |
      tokener keys set-status <key-id> --status disabled -o json
      tokener keys set-status <key-id> --status active -o json
    params:
      id:
        argument: key-id
        help: API key ID

  update-limits:
    match:
      method: PATCH
      path: /api/v1/keys/{id}/limits
    body:
      flags: true
    use: replace-limits
    short: Replace all limits for an API key
    long: |
      Replaces the key's complete budget, rate, model, concurrency, and expiry
      limit set. This is not a partial update: every omitted or null field is
      cleared. Always provide the complete desired state.
    notes:
      - "This is a full replacement: omitted fields are cleared."
    example: |
      tokener keys replace-limits <key-id> --file limits.json -o json
      tokener keys replace-limits <key-id> \
        --max-budget-usd 100 \
        --budget-duration monthly \
        --rpm-limit 60 \
        --tpm-limit 100000 \
        --max-parallel-requests 4 \
        --expires-at 2027-01-01T00:00:00Z \
        --allowed-models gpt-5 \
        -o json
    params:
      id:
        argument: key-id
        help: API key ID

  catalog:
    match:
      method: GET
      path: /api/v1/models
    use: list
    aliases: [catalog]
    short: List models available to the organization
    long: |
      Lists customer-facing models currently available through Tokener.ai,
      including provider, category, context size, availability, and pricing.
    example: |
      tokener models list
      tokener models list -o json
    output:
      default_columns: [id, name, provider, context, inputPer1m, outputPer1m]
      column_labels:
        id: MODEL
        name: NAME
        provider: PROVIDER
        context: CONTEXT
        inputPer1m: "INPUT / 1M"
        outputPer1m: "OUTPUT / 1M"

  public-model-catalog:
    match:
      method: GET
      path: /api/public/v1/models
    hidden: true
    short: Get the anonymous machine catalog
    long: |
      Returns the stable, versioned anonymous model catalog intended for
      external integrations. This command does not require authentication.
    example: |
      tokener models public-model-catalog -o json

  summary:
    match:
      method: GET
      path: /api/v1/usage/summary
    short: Show usage totals
    long: |
      Shows total requests, tokens, cache activity, and billed spend for a
      7- or 30-day usage window.
    example: |
      tokener usage summary
      tokener usage summary --range 30 -o json
    output:
      default_columns: [summary.requests, summary.tokens, summary.spendUsdMicro, summary.inputTokens, summary.outputTokens, summary.cacheReadInputTokens]
      column_labels:
        summary.requests: REQUESTS
        summary.tokens: TOKENS
        summary.spendUsdMicro: SPEND
        summary.inputTokens: INPUT
        summary.outputTokens: OUTPUT
        summary.cacheReadInputTokens: "CACHE READ"
      column_formats:
        summary.spendUsdMicro:
          kind: currency
          currency: USD
          source_scale: 6
          grouping: true
          min_fraction_digits: 2
          max_fraction_digits: 6
    params:
      range:
        help: Usage window in days (7 or 30)

  series:
    match:
      method: GET
      path: /api/v1/usage/series
    use: daily
    aliases: [series]
    short: Show daily usage
    long: |
      Shows one usage point per day with per-model segments for a 7- or 30-day
      window.
    example: |
      tokener usage daily
      tokener usage daily --range 30 -o json
    output:
      default_columns: [day, requests, tokens, spendUsdMicro]
      column_labels:
        day: DAY
        requests: REQUESTS
        tokens: TOKENS
        spendUsdMicro: SPEND
      column_formats:
        spendUsdMicro:
          kind: currency
          currency: USD
          source_scale: 6
          grouping: true
          min_fraction_digits: 2
          max_fraction_digits: 6
    params:
      range:
        help: Usage window in days (7 or 30)

  breakdown:
    match:
      method: GET
      path: /api/v1/usage/breakdown
    use: by-model
    aliases: [breakdown]
    short: Show usage grouped by model
    long: |
      Aggregates requests, tokens, cache activity, and billed spend by model
      for a 7- or 30-day window.
    example: |
      tokener usage by-model
      tokener usage by-model --range 30 -o json
    output:
      default_columns: [key, requests, inputTokens, outputTokens, cacheReadInputTokens, spendUsdMicro]
      column_labels:
        key: MODEL
        requests: REQUESTS
        inputTokens: INPUT
        outputTokens: OUTPUT
        cacheReadInputTokens: "CACHE READ"
        spendUsdMicro: SPEND
      column_formats:
        spendUsdMicro:
          kind: currency
          currency: USD
          source_scale: 6
          grouping: true
          min_fraction_digits: 2
          max_fraction_digits: 6
    params:
      range:
        help: Usage window in days (7 or 30)

  provision-partner-organization:
    match:
      method: POST
      path: /api/partner/v1/organizations
    ignore: true

  get-partner-organization:
    match:
      method: GET
      path: /api/partner/v1/organizations/by-external-ref/{externalRef}
    ignore: true

  set-partner-organization-status:
    match:
      method: PATCH
      path: /api/partner/v1/organizations/by-external-ref/{externalRef}
    ignore: true

  rotate-partner-organization-key:
    match:
      method: POST
      path: /api/partner/v1/organizations/by-external-ref/{externalRef}/key
    ignore: true

  revoke-partner-organization-key:
    match:
      method: DELETE
      path: /api/partner/v1/organizations/by-external-ref/{externalRef}/key
    ignore: true

  get-partner-organization-models:
    match:
      method: GET
      path: /api/partner/v1/organizations/by-external-ref/{externalRef}/models
    ignore: true

  get-partner-organization-balance:
    match:
      method: GET
      path: /api/partner/v1/organizations/by-external-ref/{externalRef}/balance
    ignore: true

  get-partner-organization-usage:
    match:
      method: GET
      path: /api/partner/v1/organizations/by-external-ref/{externalRef}/usage
    ignore: true

  post-partner-credit-event:
    match:
      method: POST
      path: /api/partner/v1/credit-events
    ignore: true

  get-partner-credit-event:
    match:
      method: GET
      path: /api/partner/v1/credit-events/{eventId}
    ignore: true

  create-partner-allowance-window:
    match:
      method: POST
      path: /api/partner/v1/allowance-windows
    ignore: true

  get-partner-allowance-window:
    match:
      method: GET
      path: /api/partner/v1/allowance-windows/{windowId}
    ignore: true

  correct-partner-allowance-window:
    match:
      method: POST
      path: /api/partner/v1/allowance-windows/{windowId}/corrections
    ignore: true
