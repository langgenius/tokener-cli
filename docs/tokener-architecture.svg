  <rect width="1800" height="1100" fill="#fbfbfa"/>
  <path d="M54 38H1746" stroke="#17191d" stroke-width="4" stroke-linecap="round"/>
  <g class="sans">
    <rect x="56" y="70" width="42" height="42" rx="9" fill="#173fff"/>
    <path d="M67 83H87M77 73V103" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
    <text x="116" y="102" class="kicker blue">TOKENER · RUNTIME ARCHITECTURE</text>
    <text x="56" y="157" class="title ink">One binary. Two planes. No hidden proxy.</text>
    <text x="56" y="190" class="subtitle muted">Console management ends at console.tokener.dev. Model traffic starts in native harnesses and goes to api.tokener.dev.</text>
  </g>

