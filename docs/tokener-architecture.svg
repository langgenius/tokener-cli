<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" data-blueprint-diagram="true" viewBox="0 0 1800 1100" role="img" aria-labelledby="title desc" text-rendering="geometricPrecision">
  <title id="title">tokener-cli architecture</title>
  <desc id="desc">The tokener binary combines a generated Console management client with a custom native agent launcher. Management requests terminate at the Tokener Console API, while native coding harnesses send model traffic directly through the Tokener Gateway. Build-time pipelines generate the management surface and embed a verified rx snapshot.</desc>
