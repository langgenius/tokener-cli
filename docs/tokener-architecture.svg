    <text x="82" y="951" class="rail-body" fill="#f2f3f5">→ specsync → overlays/console.yaml</text>
    <text x="82" y="981" class="rail-body" fill="#8da4ff">→ Lathe v0.6.1 → generated specs + Skill</text>
    <text x="82" y="1017" class="code-sm" fill="#777c84">human edits inputs · never internal/generated</text>

    <text x="690" y="883" class="rail-title" fill="#8f949c">EMBEDDED AGENT ENGINE</text>
    <text x="690" y="921" class="rail-body" fill="#f2f3f5">Recall/rx v0.5.7 @ f02da0a…</text>
    <text x="690" y="951" class="rail-body" fill="#f2f3f5">→ four native builds → host probe 1.0</text>
    <text x="690" y="981" class="rail-body" fill="#85d096">→ provenance + SHA lock → Go embed</text>
    <text x="690" y="1017" class="code-sm" fill="#777c84">TOKENER_RX allowed only after capability handshake</text>

    <text x="1268" y="883" class="rail-title" fill="#8f949c">RELEASE PATH</text>
    <text x="1268" y="921" class="rail-body" fill="#f2f3f5">tag v* → make ci-check</text>
    <text x="1268" y="951" class="rail-body" fill="#f2f3f5">→ GoReleaser → GitHub Releases</text>
    <text x="1268" y="981" class="rail-body" fill="#f1a17f">→ Homebrew formula pull request</text>
    <text x="1268" y="1017" class="code-sm" fill="#777c84">darwin · linux · windows</text>
  </g>

  <text x="900" y="1082" text-anchor="middle" class="subtitle ink">The CLI manages accounts. The launched harness carries model traffic.</text>
