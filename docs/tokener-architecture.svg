    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#e55d2d"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#3e9954"/></marker>
    <style>
      .sans{font-family:"Inter","Helvetica Neue",Arial,sans-serif}.mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace}.ink{fill:#17191d}.muted{fill:#6b7078}.blue{fill:#173fff}.orange{fill:#d95429}.green{fill:#3e9954}.purple{fill:#7650bd}.kicker{font-family:"SFMono-Regular",Consolas,monospace;font-size:15px;font-weight:700;letter-spacing:2.5px}.title{font-family:"Inter","Helvetica Neue",Arial,sans-serif;font-size:44px;font-weight:800;letter-spacing:-1.2px}.subtitle{font-family:"Inter","Helvetica Neue",Arial,sans-serif;font-size:18px;font-weight:400}.lane-title{font-family:"SFMono-Regular",Consolas,monospace;font-size:15px;font-weight:700;letter-spacing:2px}.lane-number{font-family:"SFMono-Regular",Consolas,monospace;font-size:14px;font-weight:700}.card-title{font-family:"Inter","Helvetica Neue",Arial,sans-serif;font-size:23px;font-weight:700}.card-title-sm{font-family:"Inter","Helvetica Neue",Arial,sans-serif;font-size:19px;font-weight:700}.body{font-family:"Inter","Helvetica Neue",Arial,sans-serif;font-size:15px;font-weight:400}.body-sm{font-family:"Inter","Helvetica Neue",Arial,sans-serif;font-size:13px;font-weight:400}.code{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace;font-size:13px;font-weight:500}.code-sm{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace;font-size:12px;font-weight:500}.badge-main{font-family:"Inter","Helvetica Neue",Arial,sans-serif;font-size:19px;font-weight:700}.badge-sub{font-family:"SFMono-Regular",Consolas,monospace;font-size:12px;font-weight:700;letter-spacing:1.4px}.rail-title{font-family:"SFMono-Regular",Consolas,monospace;font-size:14px;font-weight:700;letter-spacing:2px}.rail-body{font-family:"SFMono-Regular",Consolas,monospace;font-size:14px;font-weight:500}.edge-label{font-family:"SFMono-Regular",Consolas,monospace;font-size:11px;font-weight:700}.line-blue{fill:none;stroke:#173fff;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}.line-orange{fill:none;stroke:#e55d2d;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.line-green{fill:none;stroke:#3e9954;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}.line-gray{fill:none;stroke:#aeb4be;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
    </style>
